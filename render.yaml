# DEPRECATED — do not use for Iskonnect production.
# Live stack: Supabase Postgres + Render (gunicorn via Procfile) + GitHub Actions crons.
# See docs/DEPLOYMENT.md. This file is an optional Render-native blueprint only.
# Render.com blueprint - optional
# Create a Web Service and PostgreSQL database in the dashboard, then set:
# DATABASE_URL, CORS_ORIGINS, SECRET_KEY, AUTH_DISABLED=false
services:
  - type: web
    name: iskonnect-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    releaseCommand: alembic upgrade head
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.12"
      - key: DATABASE_URL
        fromDatabase:
          name: iskonnect-db
          property: connectionString
      - key: AUTH_DISABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false  # Set in dashboard to include frontend URL

  # Scraping removed — use GitHub Actions deadline-maintenance and link-checker crons instead.
