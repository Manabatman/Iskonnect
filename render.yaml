# Render.com blueprint - optional
# Create a Web Service and PostgreSQL database in the dashboard, then set:
# DATABASE_URL, CORS_ORIGINS, SECRET_KEY, AUTH_DISABLED=false
services:
  - type: web
    name: iskonnect-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    releaseCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iskonnect-db
          property: connectionString
      - key: AUTH_DISABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false  # Set in dashboard to include frontend URL

  # Daily catalog refresh: scrape → raw JSON → staging (admin still approves)
  - type: cron
    name: scholarship-scrape-ingest
    runtime: python
    schedule: "0 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.scrapers.scrape_philscholar && python -m app.scripts.ingest_scraped --source data/raw/philscholar_$(date +%Y-%m-%d).json
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iskonnect-db
          property: connectionString
