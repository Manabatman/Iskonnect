name: Render keepalive (secondary)

on:
  schedule:
    # Offset from primary keepalive to reduce simultaneous cold gaps
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health (secondary)
        env:
          API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "RENDER_API_URL secret not set — skipping keepalive"
            exit 0
          fi
          curl -fsS --max-time 60 "${API_URL%/}/health" || exit 1
