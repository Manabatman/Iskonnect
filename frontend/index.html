<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Iskonnect - Scholarship Matching Platform</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Apply theme class before React paints (avoids flash). Default = light when no key. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var root = document.documentElement;
          root.classList.remove("dark");
          if (t === "dark") root.classList.add("dark");
          else if (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches) root.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
